<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AsizweAI - Let Us Hear</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app" role="application" aria-label="AsizweAI Translation Extension">
    <!-- Glassmorphism Background Elements -->
    <div class="bg-gradient" aria-hidden="true"></div>
    <div class="bg-orb bg-orb-1" aria-hidden="true"></div>
    <div class="bg-orb bg-orb-2" aria-hidden="true"></div>

    <div class="container">
      <!-- Header -->
      <header class="header" role="banner">
        <div class="brand">
          <div class="brand-logo" aria-hidden="true">
            <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
              <defs>
                <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#6366f1"/>
                  <stop offset="50%" stop-color="#8b5cf6"/>
                  <stop offset="100%" stop-color="#a855f7"/>
                </linearGradient>
              </defs>
              <circle cx="20" cy="20" r="18" stroke="url(#logoGradient)" stroke-width="2.5" fill="none"/>
              <path d="M14 24L20 14L26 24" stroke="url(#logoGradient)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M16 21H24" stroke="url(#logoGradient)" stroke-width="2.5" stroke-linecap="round"/>
            </svg>
          </div>
          <div class="brand-text">
            <h1 class="brand-name">AsizweAI</h1>
            <span class="brand-tagline">Let Us Hear</span>
          </div>
        </div>
        <button
          id="settingsBtn"
          class="btn-icon"
          aria-label="Open settings"
          title="Settings"
        >
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
        </button>
      </header>

      <!-- Main Control -->
      <section class="control-section" aria-label="Translation Control">
        <button
          id="toggleBtn"
          class="control-btn"
          data-state="idle"
          aria-label="Start translation"
          aria-pressed="false"
        >
          <div class="control-pulse" aria-hidden="true"></div>
          <div class="control-ring" aria-hidden="true"></div>
          <div class="control-inner">
            <svg class="icon-mic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
              <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
              <line x1="12" y1="19" x2="12" y2="23"/>
              <line x1="8" y1="23" x2="16" y2="23"/>
            </svg>
            <svg class="icon-stop" viewBox="0 0 24 24" fill="currentColor">
              <rect x="6" y="6" width="12" height="12" rx="2"/>
            </svg>
          </div>
          <!-- Loading Spinner -->
          <div class="control-loader" aria-hidden="true">
            <svg viewBox="0 0 50 50">
              <circle cx="25" cy="25" r="20" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-dasharray="80 40"/>
            </svg>
          </div>
        </button>
        <p id="statusText" class="status-text" aria-live="polite">Ready to translate</p>
      </section>

      <!-- Language Selection -->
      <section class="language-section glass-card" aria-label="Language Selection">
        <div class="language-grid">
          <!-- Source Language -->
          <div class="language-field">
            <label class="field-label" for="sourceLang">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
              </svg>
              From
            </label>
            <div class="select-wrapper">
              <select id="sourceLang" class="select-input" aria-describedby="sourceLangDesc">
                <option value="auto">Auto-detect</option>
                <option value="zu">Zulu</option>
                <option value="xh">Xhosa</option>
                <option value="af">Afrikaans</option>
                <option value="en">English</option>
                <option value="es">Spanish</option>
                <option value="fr">French</option>
                <option value="de">German</option>
                <option value="pt">Portuguese</option>
                <option value="it">Italian</option>
                <option value="ja">Japanese</option>
                <option value="ko">Korean</option>
                <option value="zh">Chinese</option>
                <option value="hi">Hindi</option>
                <option value="ar">Arabic</option>
                <option value="ru">Russian</option>
              </select>
              <span class="select-arrow" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <polyline points="6 9 12 15 18 9"/>
                </svg>
              </span>
            </div>
            <span id="sourceLangDesc" class="visually-hidden">Select the source language for translation</span>
          </div>

          <!-- Swap Button -->
          <button
            id="swapBtn"
            class="swap-btn"
            aria-label="Swap languages"
            title="Swap languages"
          >
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="17 1 21 5 17 9"/>
              <path d="M3 11V9a4 4 0 0 1 4-4h14"/>
              <polyline points="7 23 3 19 7 15"/>
              <path d="M21 13v2a4 4 0 0 1-4 4H3"/>
            </svg>
          </button>

          <!-- Target Language -->
          <div class="language-field">
            <label class="field-label" for="targetLang">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="12 2 2 7 12 12 22 7 12 2"/>
                <polyline points="2 17 12 22 22 17"/>
                <polyline points="2 12 12 17 22 12"/>
              </svg>
              To
            </label>
            <div class="select-wrapper">
              <select id="targetLang" class="select-input" aria-describedby="targetLangDesc">
                <option value="en" selected>English</option>
                <option value="zu">Zulu</option>
                <option value="xh">Xhosa</option>
                <option value="af">Afrikaans</option>
                <option value="es">Spanish</option>
                <option value="fr">French</option>
                <option value="de">German</option>
                <option value="pt">Portuguese</option>
                <option value="it">Italian</option>
                <option value="ja">Japanese</option>
                <option value="ko">Korean</option>
                <option value="zh">Chinese</option>
                <option value="hi">Hindi</option>
                <option value="ar">Arabic</option>
                <option value="ru">Russian</option>
              </select>
              <span class="select-arrow" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <polyline points="6 9 12 15 18 9"/>
                </svg>
              </span>
            </div>
            <span id="targetLangDesc" class="visually-hidden">Select the target language for translation</span>
          </div>
        </div>
      </section>

      <!-- Volume Controls -->
      <section class="volume-section" aria-label="Volume Controls">
        <div class="volume-card glass-card">
          <div class="volume-header">
            <div class="volume-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
                <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
              </svg>
            </div>
            <div class="volume-info">
              <span class="volume-label">Original Audio</span>
              <span id="originalVolumeValue" class="volume-value">30%</span>
            </div>
          </div>
          <div class="slider-container">
            <input
              type="range"
              id="originalVolume"
              class="slider"
              min="0"
              max="100"
              value="30"
              aria-label="Original audio volume"
              aria-valuenow="30"
              aria-valuemin="0"
              aria-valuemax="100"
            >
            <div class="slider-track" aria-hidden="true">
              <div class="slider-fill" style="width: 30%"></div>
            </div>
          </div>
        </div>

        <div class="volume-card glass-card">
          <div class="volume-header">
            <div class="volume-icon volume-icon-accent" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
                <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                <line x1="12" y1="19" x2="12" y2="23"/>
                <line x1="8" y1="23" x2="16" y2="23"/>
              </svg>
            </div>
            <div class="volume-info">
              <span class="volume-label">Translation Voice</span>
              <span id="translationVolumeValue" class="volume-value volume-value-accent">100%</span>
            </div>
          </div>
          <div class="slider-container">
            <input
              type="range"
              id="translationVolume"
              class="slider slider-accent"
              min="0"
              max="100"
              value="100"
              aria-label="Translation voice volume"
              aria-valuenow="100"
              aria-valuemin="0"
              aria-valuemax="100"
            >
            <div class="slider-track" aria-hidden="true">
              <div class="slider-fill slider-fill-accent" style="width: 100%"></div>
            </div>
          </div>
        </div>
      </section>

      <!-- Status Indicator -->
      <div class="status-badge-container">
        <div id="statusIndicator" class="status-badge" data-status="idle" role="status" aria-live="polite">
          <span class="status-dot" aria-hidden="true"></span>
          <span class="status-label">Idle</span>
        </div>
      </div>

      <!-- Transcript Section -->
      <section class="transcript-section glass-card" aria-label="Live Transcript">
        <header class="transcript-header">
          <div class="transcript-title">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
              <polyline points="14 2 14 8 20 8"/>
              <line x1="16" y1="13" x2="8" y2="13"/>
              <line x1="16" y1="17" x2="8" y2="17"/>
            </svg>
            <span>Live Transcript</span>
          </div>
          <div class="transcript-actions">
            <button
              id="copyTranscript"
              class="action-btn"
              aria-label="Copy transcript to clipboard"
              title="Copy to clipboard"
              disabled
            >
              <svg class="icon-copy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
              </svg>
              <svg class="icon-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="20 6 9 17 4 12"/>
              </svg>
            </button>
            <button
              id="clearTranscript"
              class="action-btn action-btn-danger"
              aria-label="Clear transcript"
              title="Clear transcript"
            >
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="3 6 5 6 21 6"/>
                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
              </svg>
            </button>
          </div>
        </header>
        <div
          id="transcriptDisplay"
          class="transcript-content"
          role="log"
          aria-live="polite"
          aria-relevant="additions"
          tabindex="0"
        >
          <div class="transcript-empty">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
              <line x1="9" y1="10" x2="15" y2="10"/>
            </svg>
            <p>Transcription will appear here...</p>
          </div>
        </div>
      </section>

      <!-- Error Display -->
      <div
        id="errorDisplay"
        class="error-banner hidden"
        role="alert"
        aria-live="assertive"
      >
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="8" x2="12" y2="12"/>
          <line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        <span id="errorText"></span>
        <button id="errorDismiss" class="error-dismiss" aria-label="Dismiss error">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>

      <!-- Toast Notification -->
      <div id="toast" class="toast" role="status" aria-live="polite" aria-atomic="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
        <span id="toastText">Copied to clipboard</span>
      </div>
    </div>
  </div>

  <script src="popup.js" type="module"></script>
</body>
</html>
